name: Build and deploy .NET application to container app mtogoservicesauthapi-app-2025010
on:
  push:
    branches:
    - Developing-Large-Systems
env:
  CONTAINER_APP_CONTAINER_NAME: mtogoservicesauthapi
  CONTAINER_APP_NAME: mtogoservicesauthapi-app-2025010
  CONTAINER_APP_RESOURCE_GROUP_NAME: AuthMTOGO
  CONTAINER_REGISTRY_LOGIN_SERVER: mtogoservicesauthapi20250106140605.azurecr.io
  DOCKER_FILE_PATH: MTOGO.Services.AuthAPI/Dockerfile
  PROJECT_NAME_FOR_DOCKER: mtogoservicesauthapi
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout to the branch
      uses: actions/checkout@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Log in to container registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.CONTAINER_REGISTRY_LOGIN_SERVER }}
        username: ${{ secrets.MTOGOServicesAuthAPI20250106140605_USERNAME_211C }}
        password: ${{ secrets.MTOGOServicesAuthAPI20250106140605_PASSWORD_211C }}
    - name: Build and push container image to registry
      uses: docker/build-push-action@v6
      with:
        push: true
        tags: ${{ env.CONTAINER_REGISTRY_LOGIN_SERVER }}/${{ env.PROJECT_NAME_FOR_DOCKER }}:${{ github.sha }}
        file: ${{ env.DOCKER_FILE_PATH }}
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.mtogoservicesauthapi_app_2025010_SPN }}
    - name: Deploy to containerapp
      uses: azure/CLI@v2
      with:
        inlineScript: >
          az config set extension.use_dynamic_install=yes_without_prompt

          az containerapp registry set --name ${{ env.CONTAINER_APP_NAME }} --resource-group ${{ env.CONTAINER_APP_RESOURCE_GROUP_NAME }} --server ${{ env.CONTAINER_REGISTRY_LOGIN_SERVER }} --username ${{ secrets.MTOGOServicesAuthAPI20250106140605_USERNAME_211C }} --password ${{ secrets.MTOGOServicesAuthAPI20250106140605_PASSWORD_211C }}

          az containerapp update --name ${{ env.CONTAINER_APP_NAME }} --container-name ${{ env.CONTAINER_APP_CONTAINER_NAME }} --resource-group ${{ env.CONTAINER_APP_RESOURCE_GROUP_NAME }} --image ${{ env.CONTAINER_REGISTRY_LOGIN_SERVER }}/${{ env.PROJECT_NAME_FOR_DOCKER }}:${{ github.sha }}
    - name: logout
      run: >
        az logout
